name: Tokenizer Accuracy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-accuracy:
    name: Test tokenizer ids
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch bench references and tokenizer files
        run: bash .github/fetch-bench.sh

      - name: Run id oracles
        run: cargo test --manifest-path bench/tokie/Cargo.toml --tests -- --test-threads=1
