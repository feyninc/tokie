name: Speed Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The bench manifest asks for fat LTO. CI turns that off so the job finishes.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  benchmark:
    name: GPT-2 encode speed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch bench references and tokenizer files
        run: bash .github/fetch-bench.sh

      - name: Download OpenWebText sample
        run: |
          mkdir -p benches/data
          if [ ! -f benches/data/owt_sample.txt ]; then
            curl -sL "https://huggingface.co/datasets/stanford-cs336/owt-sample/resolve/main/owt_train.txt.gz" \
              | gunzip -c 2>/dev/null | head -c 50000000 > benches/data/owt_sample.txt || true
          fi
          test "$(stat -c%s benches/data/owt_sample.txt)" -eq 50000000

      - name: Time GPT-2
        run: |
          set -o pipefail
          cargo run --manifest-path bench/tokie/Cargo.toml --release -- \
            --file benches/data/owt_sample.txt \
            --row gpt2 \
            --reps 3 \
            | tee benchmark_gpt2.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_gpt2.txt
