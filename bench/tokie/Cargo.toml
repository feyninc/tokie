[workspace]

[package]
name = "tokie-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tokie = { path = "../../crates/tokie" }
tk-encode = { path = "../../../tokenizers-v1/tokenizers/tk-encode", default-features = false, features = ["bpe", "unigram", "wordpiece", "normalizers", "fancy-regex"] }
tk-serialize = { path = "../../../tokenizers-v1/tokenizers/tk-serialize", default-features = false, features = ["deserialize", "bpe", "unigram", "wordpiece", "normalizers", "fancy-regex"] }
tk-convert = { path = "../../../tokenizers-v1/tokenizers/tk-convert" }
serde_json = "1"
gigatoken = { path = "../../../gigatoken" }

[profile.release]
lto = "fat"
codegen-units = 1
