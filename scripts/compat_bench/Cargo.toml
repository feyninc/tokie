[workspace]

[package]
name = "compat-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokie = { path = "../../crates/tokie" }
# External checkout, resolved through scripts/compat_bench/vendor/gigatoken.
# build.sh creates that symlink from GIGATOKEN_DIR (default
# $HOME/Workspaces/gigatoken) and records the resolved path in the artifact.
gigatoken = { path = "vendor/gigatoken" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
lto = "fat"
codegen-units = 1
