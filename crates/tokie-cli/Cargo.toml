[package]
name = "tokie-cli"
version = "0.2.0"
edition = "2024"
description = "Encode and decode with a tokie tokenizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chonkie-inc/tokie"

[[bin]]
name = "tokie"
path = "src/main.rs"

[dependencies]
tokie = { path = "../tokie" }
clap = { version = "4", features = ["derive"] }
