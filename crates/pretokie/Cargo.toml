[package]
name = "pretokie"
version = "0.1.3"
edition = "2021"
description = "Fast, zero-allocation pretokenizers for BPE tokenizers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chonkie-inc/tokie"
documentation = "https://docs.rs/pretokie"
keywords = ["tokenizer", "pretokenizer", "bpe", "nlp", "transformers"]
categories = ["text-processing"]
readme = "README.md"

[features]
regex = ["regex-automata"]
# Dev-only oracle: a faithful re-implementation of HuggingFace tokenizers'
# pretokenization (Oniguruma via `onig`, Ruby syntax, no options — see
# docs/pretokie-v2/00-oracle-engine.md). Used by tests/golden.rs and
# examples/dump.rs; never enabled by published builds.
oracle = ["dep:onig"]

[dependencies]
regex-automata = { version = "0.4", optional = true }
unicode-general-category = "1.0"
onig = { version = "6.5.1", default-features = false, optional = true }

[dev-dependencies]
foldhash = "0.1"

[[test]]
name = "golden"
required-features = ["oracle"]

[[example]]
name = "dump"
required-features = ["oracle"]
