[package]
name = "tokie-python"
version = "0.2.0"
edition = "2024"
description = "Python bindings for tokie — blazingly fast tokenizer"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "tokie"
crate-type = ["cdylib"]

[features]
default = ["hub"]
hub = ["tokie-core/hub"]

[dependencies]
tokie-core = { package = "tokie", path = "../tokie" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
